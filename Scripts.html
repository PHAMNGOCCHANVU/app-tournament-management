<script>
  /**
   * Client Application State & Single Page Application (SPA) Engine
   * Auth Mode: "Execute as user accessing the web app" (Native Google Auth)
   */
  const CATEGORY_LABELS = {
    open: 'Tất cả (Mở)',
    mens: 'Nam',
    womens: 'Nữ',
    mixed: 'Nam Nữ',
    mens_singles: 'Đơn Nam',
    womens_singles: 'Đơn Nữ',
    mens_doubles: 'Đôi Nam',
    womens_doubles: 'Đôi Nữ',
    mixed_doubles: 'Đôi Nam Nữ'
  };

  const POSITION_LABELS = {
    goalkeeper: 'Thủ môn',
    defender: 'Hậu vệ',
    midfielder: 'Tiền vệ',
    forward: 'Tiền đạo',
    setter: 'Chuyền hai',
    middle_blocker: 'Đập giữa',
    outside_hitter: 'Đập biên',
    opposite_hitter: 'Đối chuyền',
    libero: 'Tự do (Libero)'
  };

  const App = {
    state: {
      user: { email: '', role: 'viewer', isLoggedIn: false },
      tournamentRoles: {},  // Per-tournament role cache: { "T001": "organizer", "T002": "referee" }
      currentPage: 'dashboard',
      params: {}
    },

    /**
     * Promise Wrapper around Apps Script google.script.run API
     */
    server: {
      call: function (functionName, ...args) {
        return new Promise((resolve, reject) => {
          if (typeof google === 'undefined' || !google.script || !google.script.run) {
            console.warn('google.script.run is unavailable. Operating in offline/test mode.');
            reject(new Error('Môi trường Apps Script không khả dụng.'));
            return;
          }

          google.script.run
            .withSuccessHandler(response => resolve(response))
            .withFailureHandler(err => reject(err))
            [functionName](...args);
        });
      }
    },

    /**
     * SPA Router
     */
    router: {
      navigateTo: function (pageName, params = {}) {
        App.state.currentPage = pageName;
        App.state.params = params;

        // Update active nav items
        document.querySelectorAll('.nav-item').forEach(el => {
          if (el.dataset.page === pageName) el.classList.add('active');
          else el.classList.remove('active');
        });

        // Update user badge so current tournament role badge updates
        App.updateUserBadge();

        const container = document.getElementById('app-view');
        if (!container) return;

        container.innerHTML = `
          <div class="loader-center">
            <div class="spinner"></div>
            <p>Đang tải dữ liệu...</p>
          </div>
        `;

        // Render target view template
        setTimeout(() => {
          if (typeof App.views[pageName] === 'function') {
            App.views[pageName](params);
          } else {
            container.innerHTML = `
              <div class="card" style="text-align:center; padding:3rem;">
                <h2>Trang không tồn tại</h2>
                <p style="color:var(--text-muted); margin-top:0.5rem;">Không tìm thấy view [${pageName}]</p>
                <button class="btn btn-primary" style="margin-top:1.5rem;" onclick="App.router.navigateTo('dashboard')">Về Trang chủ</button>
              </div>
            `;
          }
        }, 100);
      }
    },

    /**
     * Views Handler Registry
     */
    views: {},

    /**
     * Toast Notifications Engine
     */
    toast: {
      show: function (message, type = 'info') {
        let container = document.getElementById('toast-container');
        if (!container) {
          container = document.createElement('div');
          container.id = 'toast-container';
          container.className = 'toast-container';
          document.body.appendChild(container);
        }

        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.innerHTML = `<div>${message}</div>`;
        container.appendChild(toast);

        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateX(100%)';
          setTimeout(() => toast.remove(), 300);
        }, 4000);
      }
    },

    /**
     * Modal Dialog Handler
     */
    modal: {
      open: function (title, bodyHtml, onConfirm = null) {
        let overlay = document.getElementById('global-modal');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.id = 'global-modal';
          overlay.className = 'modal-overlay';
          overlay.innerHTML = `
            <div class="modal-box">
              <h3 id="modal-title" style="margin-bottom:1rem;"></h3>
              <div id="modal-body"></div>
              <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1.5rem;">
                <button class="btn btn-secondary" onclick="App.modal.close()">Hủy</button>
                <button class="btn btn-primary" id="modal-confirm-btn">Xác nhận</button>
              </div>
            </div>
          `;
          document.body.appendChild(overlay);
        }

        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-body').innerHTML = bodyHtml;

        const confirmBtn = document.getElementById('modal-confirm-btn');
        if (onConfirm) {
          confirmBtn.style.display = 'inline-flex';
          confirmBtn.onclick = () => {
            onConfirm();
            App.modal.close();
          };
        } else {
          confirmBtn.style.display = 'none';
        }

        setTimeout(() => overlay.classList.add('active'), 10);
      },
      close: function () {
        const overlay = document.getElementById('global-modal');
        if (overlay) {
          overlay.classList.remove('active');
        }
      }
    },

    /**
     * Per-Tournament Role Management
     */
    setTournamentRole: function (tournamentId, role) {
      if (tournamentId && role) {
        App.state.tournamentRoles[tournamentId] = role;
      }
    },

    getRoleForTournament: function (tournamentId) {
      return App.state.tournamentRoles[tournamentId] || 'viewer';
    },

    hasRoleForTournament: function (tournamentId, allowedRoles) {
      const role = App.getRoleForTournament(tournamentId);
      return allowedRoles.includes(role);
    },

    /**
     * Mobile Responsive Drawer Toggle
     */
    toggleMobileMenu: function () {
      const drawer = document.getElementById('mobile-drawer');
      const overlay = document.getElementById('mobile-drawer-overlay');
      if (drawer && overlay) {
        drawer.classList.toggle('active');
        overlay.classList.toggle('active');
      }
    },

    closeMobileMenu: function () {
      const drawer = document.getElementById('mobile-drawer');
      const overlay = document.getElementById('mobile-drawer-overlay');
      if (drawer && overlay) {
        drawer.classList.remove('active');
        overlay.classList.remove('active');
      }
    },

    /**
     * PC Circular Avatar Dropdown Popover Toggle
     */
    toggleUserDropdown: function (event) {
      if (event) event.stopPropagation();
      const popover = document.getElementById('user-dropdown-popover');
      if (popover) {
        popover.classList.toggle('active');
      }
    },

    closeUserDropdown: function () {
      const popover = document.getElementById('user-dropdown-popover');
      if (popover) {
        popover.classList.remove('active');
      }
    },

    toggleMobileUserDropdown: function (event) {
      if (event) event.stopPropagation();
      const popover = document.getElementById('mobile-user-popover');
      if (popover) {
        popover.classList.toggle('active');
      }
    },

    closeMobileUserDropdown: function () {
      const popover = document.getElementById('mobile-user-popover');
      if (popover) {
        popover.classList.remove('active');
      }
    },

    /**
     * App Initialization
     */
    init: function () {
      App.server.call('apiGetAuthContext', '', '')
        .then(res => {
          if (res) {
            App.state.user = Object.assign({}, App.state.user, res);
            App.updateUserBadge();
          }
        })
        .catch(err => console.log('Auth check error:', err));

      const initialPage = window.INITIAL_PAGE || 'dashboard';
      const tournamentId = window.INITIAL_TOURNAMENT_ID || '';
      App.router.navigateTo(initialPage, { tournamentId });
    },

    /**
     * Update Navbar User Badge & Mobile User Card
     * PC: Renders Circular Avatar Button + Dropdown Popover (with Email, Role Badge & Profile link)
     * Mobile Drawer Bottom: Renders Circular Avatar Button + Popover Menu (with Email, Role Badge & Profile link)
     */
    updateUserBadge: function () {
      const userEl = document.getElementById('nav-user-container');
      const mobileUserEl = document.getElementById('mobile-drawer-user-container');

      const displayEmail = App.state.user.email || '';

      const currentTId = App.state.params ? App.state.params.tournamentId : '';
      const roleInCurrentT = currentTId ? App.getRoleForTournament(currentTId) : '';
      const roleLabel = roleInCurrentT || App.state.user.role || 'viewer';

      const roleStyles = {
        organizer: 'background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff;',
        referee: 'background:linear-gradient(135deg,#10b981,#059669); color:#fff;',
        player: 'background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff;',
        viewer: 'background:rgba(255,255,255,0.1); color:#94a3b8;'
      };

      const initialChar = displayEmail ? displayEmail.charAt(0).toUpperCase() : '👤';

      if (displayEmail) {
        // Render PC Avatar + Popover Dropdown
        if (userEl) {
          userEl.innerHTML = `
            <div class="user-avatar-btn" id="user-avatar-btn" onclick="App.toggleUserDropdown(event)" title="${displayEmail}">
              ${initialChar}
            </div>

            <div class="user-dropdown-popover" id="user-dropdown-popover">
              <div class="user-popover-email">${displayEmail}</div>
              <div class="user-popover-badge">
                <span class="user-badge" style="${roleStyles[roleLabel] || roleStyles.viewer}">${roleLabel}</span>
              </div>
              <div class="user-popover-actions">
                <button class="btn btn-sm btn-secondary" style="width:100%; justify-content:center;" onclick="App.router.navigateTo('profile'); App.closeUserDropdown();">
                  👤 Profile
                </button>
              </div>
            </div>
          `;
        }

        // Render Mobile Drawer Bottom Footer Avatar Button + Popover
        if (mobileUserEl) {
          mobileUserEl.innerHTML = `
            <div style="display:flex; align-items:center; gap:0.75rem; cursor:pointer;" id="mobile-avatar-btn" onclick="App.toggleMobileUserDropdown(event)">
              <div class="user-avatar-btn" style="width:40px; height:40px; font-size:1.05rem; flex-shrink:0;">
                ${initialChar}
              </div>
              <div style="overflow:hidden; flex:1;">
                <div style="font-weight:600; font-size:0.85rem; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${displayEmail}</div>
                <span class="user-badge" style="margin-top:0.15rem; font-size:0.7rem; ${roleStyles[roleLabel] || roleStyles.viewer}">${roleLabel}</span>
              </div>
            </div>

            <div class="mobile-user-popover" id="mobile-user-popover">
              <div class="user-popover-email">${displayEmail}</div>
              <div class="user-popover-badge">
                <span class="user-badge" style="${roleStyles[roleLabel] || roleStyles.viewer}">${roleLabel}</span>
              </div>
              <div class="user-popover-actions">
                <button class="btn btn-sm btn-secondary" style="width:100%; justify-content:center;" onclick="App.router.navigateTo('profile'); App.closeMobileMenu(); App.closeMobileUserDropdown();">
                  👤 Profile
                </button>
              </div>
            </div>
          `;
        }
      } else {
        if (userEl) {
          userEl.innerHTML = `
            <span style="color:var(--text-muted); font-size:0.85rem;">Đang xác thực...</span>
          `;
        }
        if (mobileUserEl) {
          mobileUserEl.innerHTML = `
            <span style="color:var(--text-muted); font-size:0.85rem;">Đang xác thực...</span>
          `;
        }
      }
    },

    /**
     * Real-time Livescore Sync Engine (Firebase Realtime Stream + Fallback Polling)
     */
    livescore: {
      activeTournamentId: null,
      eventSource: null,
      pollingTimer: null,

      init: function(tournamentId) {
        if (!tournamentId) return;
        if (this.activeTournamentId === tournamentId && this.eventSource) return;

        this.stop();
        this.activeTournamentId = tournamentId;

        App.server.call('apiGetFirebasePublicConfig')
          .then(config => {
            if (config && config.enabled && config.databaseUrl) {
              this.startFirebaseStream(config.databaseUrl, tournamentId);
            } else {
              this.startPolling(tournamentId);
            }
          })
          .catch(() => {
            this.startPolling(tournamentId);
          });
      },

      startFirebaseStream: function(dbUrl, tournamentId) {
        try {
          const cleanUrl = String(dbUrl).trim().replace(/\/+$/, '');
          const streamUrl = `${cleanUrl}/tournaments/${tournamentId}/matches.json`;

          if (typeof EventSource !== 'undefined') {
            this.eventSource = new EventSource(streamUrl);
            
            // Firebase sends 'put' and 'patch' SSE events
            const handleStreamEvent = (e) => {
              try {
                const parsed = JSON.parse(e.data);
                if (parsed) {
                  // If root matches snapshot
                  if (parsed.path === '/' && parsed.data) {
                    this.handleScoreUpdate(parsed.data);
                  } else if (parsed.data) {
                    // Single match update (path e.g. "/M001" or "/" with object)
                    this.handleScoreUpdate(parsed.data);
                  }
                }
              } catch (err) {
                console.warn('[Livescore] Stream parse error:', err);
              }
            };

            this.eventSource.addEventListener('put', handleStreamEvent);
            this.eventSource.addEventListener('patch', handleStreamEvent);
            this.eventSource.onerror = () => {
              console.warn('[Livescore] Firebase SSE connection error. Falling back to active polling.');
              this.startPolling(tournamentId);
            };
          } else {
            this.startPolling(tournamentId);
          }
        } catch (e) {
          this.startPolling(tournamentId);
        }
      },

      startPolling: function(tournamentId) {
        if (this.pollingTimer) clearInterval(this.pollingTimer);
        this.pollingTimer = setInterval(() => {
          if (App.state.currentPage === 'schedule' && typeof selectedScheduleTsId !== 'undefined' && selectedScheduleTsId) {
            App.server.call('apiGetMatchesByTournamentSport', selectedScheduleTsId)
              .then(matches => {
                if (typeof renderScheduleMatchesList === 'function') {
                  renderScheduleMatchesList(matches || []);
                }
              })
              .catch(() => {});
          } else if (App.state.currentPage === 'bracket' && typeof selectedBracketTsId !== 'undefined' && selectedBracketTsId) {
            App.server.call('apiGetMatchesByTournamentSport', selectedBracketTsId)
              .then(matches => {
                if (typeof renderBracketTree === 'function') {
                  renderBracketTree(matches || []);
                }
              })
              .catch(() => {});
          }
        }, 8000);
      },

      handleScoreUpdate: function(data) {
        if (!data) return;
        const matches = data.match_id ? [data] : (typeof data === 'object' ? Object.values(data) : []);

        matches.forEach(m => {
          if (!m || !m.match_id) return;

          // 1. Update Schedule Table Score cell
          const scoreCells = document.querySelectorAll(`[data-match-score-id="${m.match_id}"]`);
          scoreCells.forEach(cell => {
            const newScoreText = `${m.team1_score !== '' ? m.team1_score : 0} - ${m.team2_score !== '' ? m.team2_score : 0}`;
            if (cell.innerText.trim() !== newScoreText) {
              cell.innerText = newScoreText;
              cell.classList.add('score-pulse');
              setTimeout(() => cell.classList.remove('score-pulse'), 1500);
            }
          });

          // 2. Update Status badge cell
          const statusBadges = document.querySelectorAll(`[data-match-status-id="${m.match_id}"]`);
          statusBadges.forEach(cell => {
            let badgeHtml = `<span class="badge badge-${m.status}">${m.status}</span>`;
            if (m.status === 'ongoing') {
              badgeHtml = `<span class="badge badge-ongoing">🔴 LIVE</span>`;
            } else if (m.status === 'waiting_confirmation') {
              badgeHtml = `<span class="badge badge-waiting_confirmation">⏳ Chờ Ký</span>`;
            } else if (m.status === 'completed') {
              badgeHtml = `<span class="badge badge-completed">✅ Xong</span>`;
            }
            cell.innerHTML = badgeHtml;
          });

          // 3. Update Bracket Tree node scores
          const bracketT1 = document.querySelector(`[data-bracket-t1-score="${m.match_id}"]`);
          const bracketT2 = document.querySelector(`[data-bracket-t2-score="${m.match_id}"]`);
          if (bracketT1) bracketT1.innerText = m.team1_score !== undefined ? m.team1_score : '';
          if (bracketT2) bracketT2.innerText = m.team2_score !== undefined ? m.team2_score : '';
        });
      },

      stop: function() {
        if (this.eventSource) {
          this.eventSource.close();
          this.eventSource = null;
        }
        if (this.pollingTimer) {
          clearInterval(this.pollingTimer);
          this.pollingTimer = null;
        }
        this.activeTournamentId = null;
      }
    }
  };

  /**
   * Global Client-side Date Formatting Helper
   */
  window.formatDate = function formatDate(dateString) {
    if (!dateString) return '';
    try {
      const d = new Date(dateString);
      if (isNaN(d.getTime())) return dateString;
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hours = String(d.getHours()).padStart(2, '0');
      const mins = String(d.getMinutes()).padStart(2, '0');

      if (hours === '00' && mins === '00') {
        return `${day}/${month}/${year}`;
      }
      return `${day}/${month}/${year} ${hours}:${mins}`;
    } catch (e) {
      return dateString;
    }
  };

  var formatDate = window.formatDate;

  // Global listener to close User Avatar Popovers when clicking outside
  document.addEventListener('click', (event) => {
    // PC Popover
    const popover = document.getElementById('user-dropdown-popover');
    const avatarBtn = document.getElementById('user-avatar-btn');
    if (popover && popover.classList.contains('active')) {
      if (!popover.contains(event.target) && (!avatarBtn || !avatarBtn.contains(event.target))) {
        App.closeUserDropdown();
      }
    }

    // Mobile Popover
    const mobilePopover = document.getElementById('mobile-user-popover');
    const mobileAvatarBtn = document.getElementById('mobile-avatar-btn');
    if (mobilePopover && mobilePopover.classList.contains('active')) {
      if (!mobilePopover.contains(event.target) && (!mobileAvatarBtn || !mobileAvatarBtn.contains(event.target))) {
        App.closeMobileUserDropdown();
      }
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    App.init();
  });
</script>
