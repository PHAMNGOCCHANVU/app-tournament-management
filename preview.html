  function handleRegisterTeamSubmit(event) {
    event.preventDefault();

    const submitBtn = document.getElementById('btn-submit-team-reg');
    submitBtn.disabled = true;
    submitBtn.innerText = '⏳ Đang đăng ký...';

    const isPaidTournament = currentSelectedTournament && (currentSelectedTournament.fee_type === 'paid' || Number(currentSelectedTournament.entry_fee) > 0);
    const paymentProof = currentUploadedReceiptBase64 || (document.getElementById('reg-payment-proof-data') ? document.getElementById('reg-payment-proof-data').value : '');

    if (isPaidTournament && !paymentProof) {
      App.toast.show('Vui lòng đính kèm ảnh biên lai chuyển khoản lệ phí giải đấu.', 'error');
      submitBtn.disabled = false;
      submitBtn.innerText = '✉️ Gửi Đơn Đăng Ký';
      return;
    }

    const athleteLevel = document.getElementById('reg-athlete-level') ? document.getElementById('reg-athlete-level').value : '';

    const playersData = [];
    document.querySelectorAll('#players-input-list .grid-4').forEach((row, idx) => {
      const name = row.querySelector('.p-name').value;
      const email = row.querySelector('.p-email').value;
      const phone = row.querySelector('.p-phone').value;
      const jersey = row.querySelector('.p-jersey').value;
      const gender = row.querySelector('.p-gender') ? row.querySelector('.p-gender').value : '';
      const position = row.querySelector('.p-position') ? row.querySelector('.p-position').value : '';

      if (name) {
        playersData.push({
          name: name,
          email: email,
          phone: phone,
          jersey_number: jersey,
          gender: gender,
          position: position,
          role_in_team: idx === 0 ? 'captain' : 'player'
        });
      }
    });

    const payload = {
      ts_id: document.getElementById('reg-ts-select').value,
      name: document.getElementById('reg-team-name').value,
      captain_email: document.getElementById('reg-captain-email').value,
      athlete_level: athleteLevel,
      payment_proof: paymentProof,
      players: playersData
    };

    App.server.call('apiRegisterTeam', payload)
      .then(team => {
        const teamId = team ? team.team_id : 'TM';
        const teamName = payload.name;

        let paymentDetailHtml = '';
        if (isPaidTournament) {
          paymentDetailHtml = `
            <div style="background:rgba(245,158,11,0.1); border:1px solid var(--warning); padding:1rem; border-radius:var(--radius-md); margin-bottom:1rem; text-align:left;">
              <p style="color:var(--warning); font-weight:bold; margin-bottom:0.25rem;">💳 Trạng thái thanh toán: Đã nộp biên lai</p>
              <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:0.5rem;">Ban tổ chức sẽ đối soát giao dịch và duyệt đơn đăng ký của bạn sớm nhất.</p>
              ${paymentProof ? `
                <div style="text-align:center;">
                  <img src="${paymentProof}" alt="Biên lai" style="max-height:120px; border-radius:4px; border:1px solid var(--border);">
                </div>
              ` : ''}
            </div>
          `;
        } else {
          paymentDetailHtml = `
            <div style="background:rgba(34,197,94,0.1); border:1px solid var(--success); padding:1rem; border-radius:var(--radius-md); margin-bottom:1rem; text-align:left;">
              <p style="color:var(--success); font-weight:bold; margin:0;">🎉 Giải đấu miễn phí tham gia. Đơn đăng ký đã gửi đến BTC!</p>
            </div>
          `;
        }

        const modalBody = `
          <div style="text-align:center;">
            <div style="font-size:3rem; margin-bottom:0.5rem;">🎉</div>
            <h3 style="color:var(--secondary); margin-bottom:0.5rem;">Đăng Ký Thành Công!</h3>
            <p style="color:var(--text-main); font-size:1.05rem; margin-bottom:1rem;">
              Đội <strong>${teamName}</strong> đã được ghi nhận vào hệ thống.
            </p>

            <div style="background:rgba(15,23,42,0.6); padding:1rem; border-radius:var(--radius-md); border:1px solid var(--border); margin-bottom:1rem; text-align:left;">
              <p style="font-size:0.9rem; margin-bottom:0.35rem;">
                Mã Đội (Team ID): <strong style="color:var(--primary); font-size:1.1rem;">${teamId}</strong>
              </p>
              ${athleteLevel ? `<p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:0.35rem;">Trình độ VĐV: <strong>Level ${athleteLevel}</strong></p>` : ''}
              <p style="font-size:0.85rem; color:var(--text-muted);">
                Trạng thái duyệt: <span class="badge badge-open">Chờ duyệt (Pending)</span>
              </p>
            </div>

            ${paymentDetailHtml}

            <p style="font-size:0.85rem; color:var(--text-muted); margin-top:1rem;">
              Ban tổ chức sẽ gửi email xác nhận đến hòm thư <b>${payload.captain_email}</b>. Bạn cũng có thể theo dõi trạng thái tại Trang Cá Nhân.
            </p>
          </div>
        `;

        App.modal.open('Xác Nhận Đăng Ký', modalBody, () => {
          App.router.navigateTo('dashboard');
        }, 'Về Trang Chủ');
      })
      .catch(err => {
        App.toast.show('Lỗi khi đăng ký: ' + err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.innerText = '✉️ Gửi Đơn Đăng Ký';
      });
  }
</script>
  <script>
  /**
   * Schedule & Match List View Controller
   * Optimized: Uses apiGetSchedulePageBundle for single round-trip data loading
   * Auth: Uses per-tournament role via App.hasRoleForTournament()
   */
  var App = window.App = window.App || {};
  App.views = App.views || {};

  App.views.schedule = function (params = {}) {
    const container = document.getElementById('app-view');
    const selectedTournamentId = params.tournamentId || '';

    container.innerHTML = `
      <div>
        <!-- View Title & Links -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
          <h2>📅 Lịch Thi Đấu & Kết Quả Trận Đấu</h2>
          
          <div style="display:flex; gap:0.5rem;" id="schedule-quick-links">
            <button class="btn btn-secondary btn-sm" onclick="App.router.navigateTo('ranking', { tournamentId: selectedScheduleTournamentId, tsId: selectedScheduleTsId })">📊 Bảng Xếp Hạng</button>
            <button class="btn btn-secondary btn-sm" onclick="App.router.navigateTo('bracket', { tournamentId: selectedScheduleTournamentId, tsId: selectedScheduleTsId })">🌿 Cây Nhánh Đấu</button>
          </div>
        </div>

        <!-- Select Tournament & Sport Filters -->
        <div class="card" style="margin-bottom:1.5rem;">
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Chọn Giải Đấu</label>
              <select class="form-control" id="sched-tournament-select" onchange="onScheduleTournamentChange()">
                <option value="">-- Chọn Giải Đấu --</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Chọn Môn Thi Đấu</label>
              <select class="form-control" id="sched-ts-select" onchange="onScheduleTsChange()">
                <option value="">-- Chọn Môn Thi Đấu --</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Matches Table List -->
        <div id="schedule-matches-container">
          <div class="loader-center"><div class="spinner"></div><p>Đang tải dữ liệu lịch thi đấu...</p></div>
        </div>
      </div>
    `;

    // Load everything in 1 bundle call
    loadScheduleBundle(selectedTournamentId);
  };

  let selectedScheduleTournamentId = '';
  let selectedScheduleTsId = '';
  let currentTournamentDetails = null;

  function loadScheduleBundle(presetTId) {
    const targetTId = presetTId || selectedScheduleTournamentId || '';
    App.server.call('apiGetSchedulePageBundle', targetTId)
      .then(bundle => {
        if (!bundle) return;

        // Populate tournament dropdown
        const select = document.getElementById('sched-tournament-select');
        if (!select) return;
        const list = bundle.tournamentList || [];
        select.innerHTML = `<option value="">-- Chọn Giải Đấu --</option>` + 
          list.map(t => `<option value="${t.tournament_id}" ${t.tournament_id === presetTId ? 'selected' : ''}>${t.name}</option>`).join('');

        // Update auth context & cache per-tournament role
        if (bundle.authContext) {
          App.state.user = Object.assign({}, App.state.user, bundle.authContext);
          if (presetTId) {
            App.setTournamentRole(presetTId, bundle.authContext.role);
          }
          App.updateUserBadge();
        }

        // Populate sport dropdown & matches
        if (bundle.tournament) {
          currentTournamentDetails = bundle.tournament;
          selectedScheduleTournamentId = bundle.tournament.tournament_id;

          const tsSelect = document.getElementById('sched-ts-select');
          if (bundle.tournament.sports && bundle.tournament.sports.length > 0) {
            tsSelect.innerHTML = bundle.tournament.sports.map(s => 
              `<option value="${s.ts_id}">${s.sport_name} (${s.format === 'round_robin' ? 'Vòng tròn' : 'Loại trực tiếp'})</option>`
            ).join('');
            selectedScheduleTsId = bundle.tournament.sports[0].ts_id;
          }

          renderScheduleMatchesList(bundle.matches || []);
          App.livescore.init(selectedScheduleTournamentId, selectedScheduleTsId);
        } else if (list.length > 0 && !presetTId) {
          // Auto-select first tournament if none specified
          select.value = list[0].tournament_id;
          onScheduleTournamentChange();
        } else {
          document.getElementById('schedule-matches-container').innerHTML = `
            <div class="card" style="text-align:center; padding:3rem;">
              <p style="color:var(--text-muted); font-size:1.1rem;">Vui lòng chọn giải đấu để xem lịch thi đấu.</p>
            </div>`;
        }
      })
      .catch(err => {
        document.getElementById('schedule-matches-container').innerHTML = `
          <div class="card"><p style="color:var(--danger);">Lỗi tải dữ liệu: ${err.message}</p></div>`;
      });
  }

  function onScheduleTournamentChange() {
    selectedScheduleTournamentId = document.getElementById('sched-tournament-select').value;
    const tsSelect = document.getElementById('sched-ts-select');
    tsSelect.innerHTML = `<option value="">-- Chọn Môn Thi Đấu --</option>`;
    document.getElementById('schedule-matches-container').innerHTML = `<div class="loader-center"><div class="spinner"></div><p>Đang tải...</p></div>`;

    if (!selectedScheduleTournamentId) {
      App.livescore.stop();
      return;
    }

    // Use bundle API for tournament change too (1 call instead of 3)
    App.server.call('apiGetSchedulePageBundle', selectedScheduleTournamentId)
      .then(bundle => {
        if (!bundle) return;

        if (bundle.authContext) {
          App.state.user = Object.assign({}, App.state.user, bundle.authContext);
          App.setTournamentRole(selectedScheduleTournamentId, bundle.authContext.role);
          App.updateUserBadge();
        }

        if (bundle.tournament) {
          currentTournamentDetails = bundle.tournament;
          const tsSelect = document.getElementById('sched-ts-select');
          if (bundle.tournament.sports && bundle.tournament.sports.length > 0) {
            tsSelect.innerHTML = bundle.tournament.sports.map(s => 
              `<option value="${s.ts_id}">${s.sport_name} (${s.format === 'round_robin' ? 'Vòng tròn' : 'Loại trực tiếp'})</option>`
            ).join('');
            selectedScheduleTsId = bundle.tournament.sports[0].ts_id;
          }
          renderScheduleMatchesList(bundle.matches || []);
          App.livescore.init(selectedScheduleTournamentId, selectedScheduleTsId);
        }
      });
  }

  function onScheduleTsChange() {
    selectedScheduleTsId = document.getElementById('sched-ts-select').value;
    const container = document.getElementById('schedule-matches-container');
    if (!selectedScheduleTsId || !container) return;

    container.innerHTML = `<div class="loader-center"><div class="spinner"></div><p>Đang tải danh sách trận đấu...</p></div>`;

    App.server.call('apiGetMatchesByTournamentSport', selectedScheduleTsId)
      .then(matches => {
        renderScheduleMatchesList(matches || []);
        App.livescore.init(selectedScheduleTournamentId, selectedScheduleTsId);
      })
      .catch(err => {
        container.innerHTML = `<div class="card"><p style="color:var(--danger);">Lỗi tải trận đấu: ${err.message}</p></div>`;
      });
  }

  function renderScheduleMatchesList(matches) {
    const container = document.getElementById('schedule-matches-container');
    if (!container) return;

    if (matches.length === 0) {
      container.innerHTML = `
        <div class="card" style="text-align:center; padding:3rem;">
          <p style="color:var(--text-muted); font-size:1.1rem;">Chưa có lịch thi đấu cho môn này.</p>
          <p style="font-size:0.9rem; color:var(--text-dim); margin-top:0.5rem;">Ban tổ chức sẽ sinh lịch thi đấu tự động sau khi kết thúc đợt đăng ký.</p>
        </div>
      `;
      return;
    }

    // Group matches by Round Name
    const roundGroups = {};
    matches.forEach(m => {
      const rName = m.round_name || `Vòng ${m.round}`;
      if (!roundGroups[rName]) roundGroups[rName] = [];
      roundGroups[rName].push(m);
    });

    const isLocked = currentTournamentDetails && ['completed', 'cancelled', 'archived'].includes(currentTournamentDetails.status);
    // FIX: Use per-tournament role instead of global App.state.user.role
    const isRefOrOrg = App.hasRoleForTournament(selectedScheduleTournamentId, ['organizer', 'referee']);

    const currentSport = currentTournamentDetails?.sports?.find(s => s.ts_id === selectedScheduleTsId);
    const sportName = currentSport ? currentSport.sport_name : '';

    container.innerHTML = Object.keys(roundGroups).map(rName => `
      <div class="card" style="margin-bottom:1.5rem;">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:0.5rem; margin-bottom:1rem;">
          <h3 style="color:var(--primary); margin:0;">${rName}</h3>
          ${isLocked ? `<span class="badge badge-completed">🔒 Đã khóa (Chỉ xem)</span>` : ''}
        </div>
        
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Đội 1</th>
                <th style="text-align:center;">Tỉ Số</th>
                <th>Đội 2</th>
                <th>Địa Điểm</th>
                <th>Trạng Thái</th>
                ${isRefOrOrg ? '<th style="text-align:right;">Thao Tác</th>' : ''}
              </tr>
            </thead>
            <tbody>
              ${roundGroups[rName].map(m => {
                let statusBadge = `<span class="badge badge-${m.status}">${m.status}</span>`;
                if (m.status === 'ongoing') {
                  statusBadge = `<span class="badge badge-ongoing">🔴 LIVE</span>`;
                } else if (m.status === 'waiting_confirmation') {
                  statusBadge = `<span class="badge badge-waiting_confirmation">⏳ Chờ Ký</span>`;
                } else if (m.status === 'completed') {
                  statusBadge = `<span class="badge badge-completed">✅ Xong</span>`;
                } else if (m.status === 'scheduled') {
                  statusBadge = `<span class="badge badge-open">📅 Lịch</span>`;
                }

                return `
                  <tr>
                    <td>
                      <strong style="${m.winner_team_id === m.team1_id ? 'color:var(--secondary);' : ''}">${m.team1_name}</strong>
                    </td>
                    <td style="text-align:center; font-weight:700; font-size:1.1rem; color:var(--accent);" data-match-score-id="${m.match_id}">
                      ${['completed', 'ongoing', 'waiting_confirmation'].includes(m.status) ? `${m.team1_score !== '' ? m.team1_score : 0} - ${m.team2_score !== '' ? m.team2_score : 0}` : 'VS'}
                    </td>
                    <td>
                      <strong style="${m.winner_team_id === m.team2_id ? 'color:var(--secondary);' : ''}">${m.team2_name}</strong>
                    </td>
                    <td>${m.location || 'Sân chính'}</td>
                    <td data-match-status-id="${m.match_id}">${statusBadge}</td>
                    ${isRefOrOrg ? `
                      <td style="text-align:right;">
                        ${isLocked ? `<span style="font-size:0.8rem; color:var(--text-muted);">🔒 Khóa</span>` : `
                          <button class="btn btn-sm btn-primary" onclick="App.router.navigateTo('match_result', { matchId: '${m.match_id}', tournamentId: '${selectedScheduleTournamentId}', tsId: '${selectedScheduleTsId}', sportName: '${encodeURIComponent(sportName)}' })">
                            ⚖️ Điều Hành / Nhập Điểm
                          </button>
                        `}
                      </td>
                    ` : ''}
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `).join('');
  }
</script>
  <script>
  /**
   * Match Result Entry View Controller (Referee/Organizer interface)
   * Enhanced with Multi-Set Score Engine (Pickleball, Badminton) & Match State Machine
   */
  App.views.match_result = function(params = {}) {
    const container = document.getElementById('app-view');
    const matchId = params.matchId;

    if (!matchId) {
      container.innerHTML = `<div class="card"><p>Thiếu tham số matchId</p></div>`;
      return;
    }

    container.innerHTML = `
      <div style="max-width: 750px; margin: 0 auto;" id="match-result-wrapper">
        <div class="loader-center"><div class="spinner"></div><p>Đang tải thông tin trận đấu...</p></div>
      </div>
    `;

    loadMatchResultDetails(matchId);
  };

  let currentMatchData = null;

  function loadMatchResultDetails(matchId) {
    App.server.call('apiGetMatchesByTournamentSport', App.state.params.tsId || '')
      .then(matches => {
        const match = (matches || []).find(m => m.match_id === matchId);
        if (!match) {
          throw new Error('Không tìm thấy thông tin trận đấu này.');
        }
        currentMatchData = match;
        renderMatchResultForm(match);
      })
      .catch(err => {
        document.getElementById('match-result-wrapper').innerHTML = `
          <div class="card" style="text-align:center; padding:2rem; color:var(--danger);">
            ${err.message}
            <div style="margin-top:1rem;">
              <button class="btn btn-secondary" onclick="App.router.navigateTo('schedule', { tournamentId: App.state.params.tournamentId || '' })">Quay lại lịch thi đấu</button>
            </div>
          </div>
        `;
      });
  }

  function renderMatchResultForm(m) {
    const wrapper = document.getElementById('match-result-wrapper');
    if (!wrapper) return;

    const sportName = App.state.params.sportName || '';
    const isSetBasedSport = sportName.includes('Pickleball') || sportName.includes('Cầu lông') || sportName.includes('Bóng bàn') || sportName.includes('Bóng chuyền');
    const isPickleball = sportName.includes('Pickleball');

    let extraObj = {};
    if (m.notes && m.notes.startsWith('{')) {
      try { extraObj = JSON.parse(m.notes); } catch (e) {}
    }

    // [MODIFY]: Lấy dữ liệu Set cũ nếu có để hiển thị lại
    const sets = extraObj.sets || {};

    wrapper.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
        <div>
          <h2>⚖️ Điều Hành & Nhập Kết Quả</h2>
          <p style="color:var(--text-muted); font-size:0.9rem;">
            ${m.round_name || 'Vòng ' + m.round} | Sân: ${m.location || 'Sân chính'}
          </p>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="App.router.navigateTo('schedule', { tournamentId: '${App.state.params.tournamentId || ''}' })">← Quay lại</button>
      </div>

      <div class="card" style="margin-bottom:1.5rem; background:rgba(30,41,59,0.9);">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
          <div style="display:flex; align-items:center; gap:0.75rem;">
            <span style="color:var(--text-muted); font-size:0.9rem;">Trạng thái trận đấu:</span>
            <span class="badge badge-${m.status}" id="match-status-badge">
              ${m.status === 'ongoing' ? '🔴 Đang thi đấu (LIVE)' : (m.status === 'waiting_confirmation' ? '⏳ Chờ ký biên bản' : (m.status === 'completed' ? '✅ Đã kết thúc' : '📅 Đã xếp lịch'))}
            </span>
          </div>

          <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
            ${m.status === 'scheduled' ? `
              <button type="button" class="btn btn-sm btn-primary" onclick="handleQuickStartMatch('${m.match_id}')">
                ▶️ Bắt Đầu Trận (ONGOING)
              </button>
            ` : ''}
            ${m.status === 'ongoing' ? `
              <button type="button" class="btn btn-sm btn-warning" onclick="handleQuickSubmitConfirmation('${m.match_id}')">
                📝 Chờ Ký Biên Bản
              </button>
            ` : ''}
          </div>
        </div>
      </div>

      <div class="card">
        <form id="match-score-form" onsubmit="handleUpdateScoreSubmit(event, '${m.match_id}')">
          
          <div class="grid-2" style="align-items:center; gap:1.5rem; margin-bottom:1.5rem;">
            <div style="text-align:center; background:rgba(15,23,42,0.7); padding:1.25rem; border-radius:var(--radius-md); border:1px solid var(--border);">
              <h3 style="margin-bottom:0.75rem; font-size:1.2rem; color:#ffffff;">${m.team1_name}</h3>
              <div class="form-group" style="margin-bottom:0;">
                <label class="form-label">${isSetBasedSport ? 'Tổng Set Thắng (Đội 1)' : 'Tỉ số Đội 1'}</label>
                <input type="number" class="form-control" id="score-t1" required value="${m.team1_score !== undefined ? m.team1_score : ''}" style="font-size:2rem; text-align:center; font-weight:800; height:56px;" ${isSetBasedSport ? 'readonly' : ''}>

            </div>

            <div style="text-align:center; background:rgba(15,23,42,0.7); padding:1.25rem; border-radius:var(--radius-md); border:1px solid var(--border);">
              <h3 style="margin-bottom:0.75rem; font-size:1.2rem; color:#ffffff;">${m.team2_name}</h3>

                <input type="number" class="form-control" id="score-t2" required value="${m.team2_score !== undefined ? m.team2_score : ''}" style="font-size:2rem; text-align:center; font-weight:800; height:56px;" ${isSetBasedSport ? 'readonly' : ''}>
              </div>
            </div>
          </div>

          ${isSetBasedSport ? `
            <div style="background:rgba(15,23,42,0.5); padding:1.25rem; border-radius:var(--radius-md); border:1px solid var(--border-highlight); margin-bottom:1.5rem;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
                <h4 style="color:var(--accent);">🎾 Điểm Chi Tiết Từng Set</h4>
                <!-- [MODIFY]: Hiển thị mốc điểm mục tiêu -->
                <span style="font-size:0.85rem; color:var(--warning); font-weight:bold;">(Mốc điểm mục tiêu: Theo cấu hình giải đấu)</span>

              <table class="set-score-table">
                <thead>
                  <tr>
                    <th style="text-align:left; width:35%;">Đội / Vận Động Viên</th>
                    <th style="width:20%;">Set 1</th>
                    <th style="width:20%;">Set 2</th>
                    <th style="width:20%;">Set 3</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td style="font-weight:600; color:#fff;">${m.team1_name}</td>
                    <td><input type="number" class="set-score-input" id="set1-t1" min="0" value="${sets.set1_a || ''}" oninput="recalcSetsWon()"></td>
                    <td><input type="number" class="set-score-input" id="set2-t1" min="0" value="${sets.set2_a || ''}" oninput="recalcSetsWon()"></td>
                    <td><input type="number" class="set-score-input" id="set3-t1" min="0" value="${sets.set3_a || ''}" oninput="recalcSetsWon()"></td>
                  </tr>
                  <tr>
                    <td style="font-weight:600; color:#fff;">${m.team2_name}</td>
                    <td><input type="number" class="set-score-input" id="set1-t2" min="0" value="${sets.set1_b || ''}" oninput="recalcSetsWon()"></td>
                    <td><input type="number" class="set-score-input" id="set2-t2" min="0" value="${sets.set2_b || ''}" oninput="recalcSetsWon()"></td>
                    <td><input type="number" class="set-score-input" id="set3-t2" min="0" value="${sets.set3_b || ''}" oninput="recalcSetsWon()"></td>
                  </tr>
                </tbody>
              </table>
            </div>
          ` : ''}

          ${isPickleball ? `
            <div style="background:rgba(15,23,42,0.4); padding:1rem; border-radius:var(--radius-md); border:1px solid var(--border); margin-bottom:1.5rem;">
              <h4 style="color:var(--secondary); margin-bottom:0.75rem; font-size:0.95rem;">🏸 Cấu hình lượt giao bóng Pickleball (Strategy Data)</h4>
              <div class="grid-2">
                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label" style="font-size:0.85rem;">Người giao bóng (Server)</label>
                  <select class="form-control" id="pb-server">
                    <option value="1" ${extraObj.server === '1' ? 'selected' : ''}>Lượt giao bóng 1 (Server 1)</option>
                    <option value="2" ${extraObj.server === '2' ? 'selected' : ''}>Lượt giao bóng 2 (Server 2)</option>
                  </select>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label" style="font-size:0.85rem;">Vị trí sân</label>
                  <select class="form-control" id="pb-position">
                    <option value="right" ${extraObj.position === 'right' ? 'selected' : ''}>Bên Phải (Right Court)</option>
                    <option value="left" ${extraObj.position === 'left' ? 'selected' : ''}>Bên Trái (Left Court)</option>
                  </select>
                </div>
              </div>
            </div>
          ` : ''}

          <div class="form-group" style="margin-bottom:1.5rem;">
            <label class="form-label">Ghi chú của Trọng tài (Thẻ phạt, sự cố, biên bản...)</label>
            <!-- [MODIFY]: Ẩn bớt object JSON nếu có để giao diện gọn gàng -->
            <textarea class="form-control" id="match-notes" rows="2" placeholder="Nhập ghi chú trận đấu...">${extraObj.text || m.notes || ''}</textarea>
          </div>

          <div style="display:flex; justify-content:flex-end; gap:1rem; flex-wrap:wrap;">
            <button type="button" class="btn btn-secondary" onclick="App.router.navigateTo('schedule', { tournamentId: '${App.state.params.tournamentId || ''}' })">Hủy</button>

          </div>
        </form>
      </div>
    `;

    // Gọi hàm tính toán ngay lúc load form để khóa Set 3 nếu đã có kết quả cũ
    if (isSetBasedSport) setTimeout(recalcSetsWon, 100);
  }

  // [MODIFY]: Logic tự động tính Set và Khóa Set 3 nếu thắng 2-0
  function recalcSetsWon() {
    const s1_t1 = parseInt(document.getElementById('set1-t1')?.value || 0, 10);
    const s1_t2 = parseInt(document.getElementById('set1-t2')?.value || 0, 10);
    const s2_t1 = parseInt(document.getElementById('set2-t1')?.value || 0, 10);
    const s2_t2 = parseInt(document.getElementById('set2-t2')?.value || 0, 10);
    let s3_t1 = parseInt(document.getElementById('set3-t1')?.value || 0, 10);
    let s3_t2 = parseInt(document.getElementById('set3-t2')?.value || 0, 10);

    let setsWonT1 = 0;
    let setsWonT2 = 0;

    // Tính kết quả Set 1
    if (s1_t1 > 0 || s1_t2 > 0) {
      if (s1_t1 > s1_t2) setsWonT1++;
      else if (s1_t2 > s1_t1) setsWonT2++;
    }
    
    // Tính kết quả Set 2
    if (s2_t1 > 0 || s2_t2 > 0) {
      if (s2_t1 > s2_t2) setsWonT1++;
      else if (s2_t2 > s2_t1) setsWonT2++;
    }

    const set3InputT1 = document.getElementById('set3-t1');
    const set3InputT2 = document.getElementById('set3-t2');

    // Nếu 1 đội đã thắng 2 Set -> Khóa Set 3
    if (setsWonT1 === 2 || setsWonT2 === 2) {
      if (set3InputT1) { set3InputT1.disabled = true; set3InputT1.value = ''; s3_t1 = 0; }
      if (set3InputT2) { set3InputT2.disabled = true; set3InputT2.value = ''; s3_t2 = 0; }
    } else {
      // Chưa có đội nào chạm 2 Set -> Mở khóa Set 3
      if (set3InputT1) set3InputT1.disabled = false;
      if (set3InputT2) set3InputT2.disabled = false;
      
      // Tính kết quả Set 3 (nếu có nhập)
      if (s3_t1 > 0 || s3_t2 > 0) {
        if (s3_t1 > s3_t2) setsWonT1++;
        else if (s3_t2 > s3_t1) setsWonT2++;
      }
    }

    const t1Input = document.getElementById('score-t1');
    const t2Input = document.getElementById('score-t2');
    if (t1Input && t2Input) {
      t1Input.value = setsWonT1;
      t2Input.value = setsWonT2;
    }
  }

  function handleQuickStartMatch(matchId) {
    App.server.call('apiStartMatch', matchId)
      .then(() => {
        App.toast.show('Đã bắt đầu trận đấu! Trạng thái: ONGOING (LIVE)', 'success');
        loadMatchResultDetails(matchId);
      })
      .catch(err => App.toast.show('Lỗi: ' + err.message, 'error'));
  }

  function handleQuickSubmitConfirmation(matchId) {
    App.server.call('apiSubmitForConfirmation', matchId)
      .then(() => {
        App.toast.show('Đã chuyển trạng thái sang Chờ Ký Biên Bản!', 'info');
        loadMatchResultDetails(matchId);
      })
      .catch(err => App.toast.show('Lỗi: ' + err.message, 'error'));
  }

  function handleUpdateScoreSubmit(event, matchId) {
    event.preventDefault();

    const submitBtn = document.getElementById('btn-save-score');
    submitBtn.disabled = true;
    submitBtn.innerText = '⏳ Đang lưu...';

    const t1Score = document.getElementById('score-t1').value;
    const t2Score = document.getElementById('score-t2').value;
    const notesText = document.getElementById('match-notes').value;

    let extraData = {};
    
    // Thu thập điểm các Set (dạng phẳng trực tiếp)
    if (document.getElementById('set1-t1')) {
      extraData.set1_a = document.getElementById('set1-t1').value;
      extraData.set1_b = document.getElementById('set1-t2').value;
      extraData.set2_a = document.getElementById('set2-t1').value;
      extraData.set2_b = document.getElementById('set2-t2').value;
      extraData.set3_a = document.getElementById('set3-t1').value;
      extraData.set3_b = document.getElementById('set3-t2').value;
    }

    const pbServer = document.getElementById('pb-server');
    const pbPosition = document.getElementById('pb-position');
    if (pbServer && pbPosition) {
      extraData.server = pbServer.value;
      extraData.position = pbPosition.value;
    }

    const extraPayload = Object.keys(extraData).length > 0 ? extraData : null;

    App.server.call('apiUpdateMatchResult', matchId, t1Score, t2Score, notesText, extraPayload)
      .then(res => {
        App.toast.show('Cập nhật tỉ số trận đấu và bảng xếp hạng thành công!', 'success');
        App.router.navigateTo('schedule', { tournamentId: App.state.params.tournamentId || '' });
      })
      .catch(err => {
        App.toast.show('Lỗi khi lưu kết quả: ' + err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.innerText = '💾 Lưu Kết Quả & Hoàn Thành Trận';
      });
  }
</script>
  <script>
  /**
   * Standings & Ranking View Controller
   * Optimized: Uses apiGetRankingPageBundle for single round-trip data loading
   */
  App.views.ranking = function(params = {}) {
    const container = document.getElementById('app-view');
    const selectedTournamentId = params.tournamentId || '';

    container.innerHTML = `
      <div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
          <h2>📊 Bảng Xếp Hạng & Điểm Số</h2>
          
          <button class="btn btn-secondary btn-sm" onclick="App.router.navigateTo('schedule', { tournamentId: selectedRankingTournamentId })">📅 Xem Lịch Thi Đấu</button>
        </div>

        <!-- Filters -->
        <div class="card" style="margin-bottom:1.5rem;">
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Chọn Giải Đấu</label>
              <select class="form-control" id="rank-tournament-select" onchange="onRankingTournamentChange()">
                <option value="">-- Chọn Giải Đấu --</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Chọn Môn Thi Đấu</label>
              <select class="form-control" id="rank-ts-select" onchange="onRankingTsChange()">
                <option value="">-- Chọn Môn Thi Đấu --</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Rankings Table Panel -->
        <div id="rankings-table-container">
          <div class="loader-center"><div class="spinner"></div><p>Đang tải bảng xếp hạng...</p></div>
        </div>
      </div>
    `;

    loadRankingBundle(selectedTournamentId);
  };

  let selectedRankingTournamentId = '';
  let selectedRankingTsId = '';
  let currentRankingSports = []; // [MODIFY]: Lưu danh sách môn để check môn Set hay môn Bàn thắng

  function loadRankingBundle(presetTId) {
    App.server.call('apiGetRankingPageBundle', presetTId || '', '')
      .then(bundle => {
        if (!bundle) return;

        const select = document.getElementById('rank-tournament-select');
        if (!select) return;
        const list = bundle.tournamentList || [];
        select.innerHTML = `<option value="">-- Chọn Giải Đấu --</option>` +
          list.map(t => `<option value="${t.tournament_id}" ${t.tournament_id === presetTId ? 'selected' : ''}>${t.name}</option>`).join('');

        if (bundle.tournament) {
          selectedRankingTournamentId = bundle.tournament.tournament_id;
          currentRankingSports = bundle.tournament.sports || [];

          const tsSelect = document.getElementById('rank-ts-select');
          if (currentRankingSports.length > 0) {
            tsSelect.innerHTML = currentRankingSports.map(s =>
              `<option value="${s.ts_id}">${s.sport_name}</option>`
            ).join('');
            selectedRankingTsId = currentRankingSports[0].ts_id;
          }

          renderRankingsTable(bundle.rankings || []);
        } else if (list.length > 0 && !presetTId) {
          select.value = list[0].tournament_id;
          onRankingTournamentChange();
        } else {
          document.getElementById('rankings-table-container').innerHTML = `
            <div class="card" style="text-align:center; padding:3rem;">
              <p style="color:var(--text-muted); font-size:1.1rem;">Vui lòng chọn giải đấu.</p>
            </div>`;
        }
      })
      .catch(err => {
        document.getElementById('rankings-table-container').innerHTML = `
          <div class="card"><p style="color:var(--danger);">Lỗi tải dữ liệu: ${err.message}</p></div>`;
      });
  }

  function onRankingTournamentChange() {
    selectedRankingTournamentId = document.getElementById('rank-tournament-select').value;
    const tsSelect = document.getElementById('rank-ts-select');
    tsSelect.innerHTML = `<option value="">-- Chọn Môn Thi Đấu --</option>`;
    document.getElementById('rankings-table-container').innerHTML = `<div class="loader-center"><div class="spinner"></div><p>Đang tải...</p></div>`;

    if (!selectedRankingTournamentId) return;

    App.server.call('apiGetRankingPageBundle', selectedRankingTournamentId, '')
      .then(bundle => {
        if (!bundle || !bundle.tournament) return;

        currentRankingSports = bundle.tournament.sports || [];
        if (currentRankingSports.length > 0) {
          tsSelect.innerHTML = currentRankingSports.map(s =>
            `<option value="${s.ts_id}">${s.sport_name}</option>`
          ).join('');
          selectedRankingTsId = currentRankingSports[0].ts_id;
        }

        renderRankingsTable(bundle.rankings || []);
      });
  }

  function onRankingTsChange() {
    selectedRankingTsId = document.getElementById('rank-ts-select').value;
    const container = document.getElementById('rankings-table-container');
    if (!selectedRankingTsId || !container) return;

    container.innerHTML = `<div class="loader-center"><div class="spinner"></div><p>Đang tính toán bảng xếp hạng...</p></div>`;

    App.server.call('apiGetRankingsByTournamentSport', selectedRankingTsId)
      .then(rankings => {
        renderRankingsTable(rankings || []);
      })
      .catch(err => {
        container.innerHTML = `<div class="card"><p style="color:var(--danger);">Lỗi tính bảng xếp hạng: ${err.message}</p></div>`;
      });
  }

  function renderRankingsTable(rankings) {
    const container = document.getElementById('rankings-table-container');
    if (!container) return;

    if (rankings.length === 0) {
      container.innerHTML = `
        <div class="card" style="text-align:center; padding:3rem;">
          <p style="color:var(--text-muted); font-size:1.1rem;">Chưa có dữ liệu xếp hạng cho môn này.</p>
        </div>
      `;
      return;
    }

    // [MODIFY]: Kiểm tra môn hiện tại đang tính Set hay Bàn thắng
    const currentTs = currentRankingSports.find(s => s.ts_id === selectedRankingTsId);
    const isSetBased = currentTs && ['sets', 'points'].includes(currentTs.scoring_type);

    const rankBadges = { 1: '🥇 1', 2: '🥈 2', 3: '🥉 3' };

    container.innerHTML = `
      <div class="card">
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th style="width:70px; text-align:center;">#</th>
                <th>Tên Đội</th>
                <th style="text-align:center;" title="Số trận">ST</th>
                <th style="text-align:center;" title="Thắng">T</th>
                ${isSetBased ? '' : '<th style="text-align:center;" title="Hòa">H</th>'}
                <th style="text-align:center;" title="Thua">B</th>
                
                ${isSetBased ? `
                  <th style="text-align:center;" title="Set Thắng">Set+</th>
                  <th style="text-align:center;" title="Set Thua">Set-</th>
                  <th style="text-align:center;" title="Hiệu số Set">HS Set</th>
                  <th style="text-align:center;" title="Điểm Thắng">Đ+</th>
                  <th style="text-align:center;" title="Điểm Thua">Đ-</th>
                  <th style="text-align:center;" title="Hiệu số Điểm">HS Điểm</th>
                ` : `
                  <th style="text-align:center;" title="Bàn thắng">BT</th>
                  <th style="text-align:center;" title="Bàn thua">BB</th>
                  <th style="text-align:center;" title="Hiệu số Bàn thắng">HS</th>
                `}
                <th style="text-align:center; font-size:1rem; color:var(--primary);">Điểm</th>
              </tr>
            </thead>
            <tbody>
              ${rankings.map(r => `
                <tr style="${r.rank <= 3 ? 'background:rgba(99,102,241,0.05); font-weight:600;' : ''}">
                  <td style="text-align:center; font-weight:800; font-size:1rem;">
                    ${rankBadges[r.rank] || r.rank}
                  </td>
                  <td><strong>${r.team_name}</strong></td>
                  <td style="text-align:center;">${r.played}</td>
                  <td style="text-align:center; color:var(--secondary);">${r.won}</td>
                  ${isSetBased ? '' : `<td style="text-align:center; color:var(--accent);">${r.drawn}</td>`}
                  <td style="text-align:center; color:var(--danger);">${r.lost}</td>
                  
                  ${isSetBased ? `
                    <td style="text-align:center;">${r.sets_won || 0}</td>
                    <td style="text-align:center;">${r.sets_lost || 0}</td>
                    <td style="text-align:center; font-weight:700; color:${(r.sets_diff || 0) > 0 ? 'var(--secondary)' : ((r.sets_diff || 0) < 0 ? 'var(--danger)' : 'var(--text-muted)')};">
                      ${(r.sets_diff || 0) > 0 ? '+' + r.sets_diff : (r.sets_diff || 0)}
                    </td>
                    <td style="text-align:center;">${r.points_for || 0}</td>
                    <td style="text-align:center;">${r.points_against || 0}</td>
                    <td style="text-align:center; font-weight:700; color:${(r.points_diff || 0) > 0 ? 'var(--secondary)' : ((r.points_diff || 0) < 0 ? 'var(--danger)' : 'var(--text-muted)')};">
                      ${(r.points_diff || 0) > 0 ? '+' + r.points_diff : (r.points_diff || 0)}
                    </td>
                  ` : `
                    <td style="text-align:center;">${r.goals_for}</td>
                    <td style="text-align:center;">${r.goals_against}</td>
                    <td style="text-align:center; font-weight:700; color:${r.goal_difference > 0 ? 'var(--secondary)' : (r.goal_difference < 0 ? 'var(--danger)' : 'var(--text-muted)')};">
                      ${r.goal_difference > 0 ? '+' + r.goal_difference : r.goal_difference}
                    </td>
                  `}
                  <td style="text-align:center; font-size:1.15rem; font-weight:800; color:var(--primary);">
                    ${r.points}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        
        <div style="margin-top:1.25rem; font-size:0.8rem; color:var(--text-dim); display:flex; gap:1.5rem; flex-wrap:wrap;">
          <span><strong>ST:</strong> Số trận đã đấu</span>
          <span><strong>T:</strong> Thắng</span>
          ${isSetBased ? '' : '<span><strong>H:</strong> Hòa</span>'}
          <span><strong>B:</strong> Thua</span>
          ${isSetBased ? `
            <span><strong>Set+:</strong> Set Thắng</span>
            <span><strong>Set-:</strong> Set Thua</span>
            <span><strong>HS Set:</strong> Hiệu số Set</span>
            <span><strong>Đ+:</strong> Điểm Thắng</span>
            <span><strong>Đ-:</strong> Điểm Thua</span>
            <span><strong>HS Điểm:</strong> Hiệu số Điểm</span>
          ` : `
            <span><strong>BT:</strong> Bàn thắng</span>
            <span><strong>BB:</strong> Bàn thua</span>
            <span><strong>HS:</strong> Hiệu số Bàn thắng</span>
          `}
        </div>
      </div>
    `;
  }
</script>

                <option value="">-- Chọn Môn Thi Đấu --</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Bracket Tree Render Container -->
        <div id="bracket-tree-container">
          <div class="loader-center"><div class="spinner"></div><p>Vui lòng chọn giải đấu.</p></div>
        </div>
      </div>
    `;

    loadBracketTournaments(selectedTournamentId);
  };

  let selectedBracketTournamentId = '';
  let selectedBracketTsId = '';

  function loadBracketTournaments(presetTId) {
    App.server.call('apiGetTournamentList')
      .then(list => {
        const select = document.getElementById('bracket-tournament-select');
        if (!select) return;

        select.innerHTML = `<option value="">-- Chọn Giải Đấu --</option>` + 
          (list || []).map(t => `<option value="${t.tournament_id}" ${t.tournament_id === presetTId ? 'selected' : ''}>${t.name}</option>`).join('');

        if (presetTId) {
          onBracketTournamentChange();
        } else if (list && list.length > 0) {
          select.value = list[0].tournament_id;
          onBracketTournamentChange();
        }
      });
  }

  function onBracketTournamentChange() {
    selectedBracketTournamentId = document.getElementById('bracket-tournament-select').value;
    const tsSelect = document.getElementById('bracket-ts-select');
    tsSelect.innerHTML = `<option value="">-- Chọn Môn Thi Đấu --</option>`;

    if (!selectedBracketTournamentId) {
      App.livescore.stop();
      return;
    }

    App.server.call('apiGetTournamentById', selectedBracketTournamentId)
      .then(t => {
        if (!t || !t.sports || t.sports.length === 0) return;
        
        // Filter single_elimination sports
        const eliminationSports = t.sports.filter(s => s.format === 'single_elimination');

        if (eliminationSports.length === 0) {
          document.getElementById('bracket-tree-container').innerHTML = `
            <div class="card" style="text-align:center; padding:3rem;">
              <p style="color:var(--text-muted);">Giải đấu này không sử dụng thể thức Loại trực tiếp (Single Elimination).</p>
            </div>
          `;
          return;
        }

        tsSelect.innerHTML = eliminationSports.map(s => `<option value="${s.ts_id}">${s.sport_name}</option>`).join('');
        selectedBracketTsId = eliminationSports[0].ts_id;
        onBracketTsChange();
        App.livescore.init(selectedBracketTournamentId, selectedBracketTsId);
      });
  }

  function onBracketTsChange() {
    selectedBracketTsId = document.getElementById('bracket-ts-select').value;
    const container = document.getElementById('bracket-tree-container');
    if (!selectedBracketTsId || !container) return;

    container.innerHTML = `<div class="loader-center"><div class="spinner"></div><p>Đang dựng nhánh đấu...</p></div>`;

    App.server.call('apiGetMatchesByTournamentSport', selectedBracketTsId)
      .then(matches => {
        renderBracketTree(matches || []);
        App.livescore.init(selectedBracketTournamentId, selectedBracketTsId);
      })
      .catch(err => {
        container.innerHTML = `<div class="card"><p style="color:var(--danger);">Lỗi dựng nhánh đấu: ${err.message}</p></div>`;
      });
  }

  function renderBracketTree(matches) {
    const container = document.getElementById('bracket-tree-container');
    if (!container) return;

    if (matches.length === 0) {
      container.innerHTML = `
        <div class="card" style="text-align:center; padding:3rem;">
          <p style="color:var(--text-muted);">Chưa có cây nhánh đấu cho môn này.</p>
        </div>
      `;
      return;
    }

    // Group by Round Number
    const roundMap = {};
    matches.forEach(m => {
      const r = Number(m.round);
      if (!roundMap[r]) roundMap[r] = [];
      roundMap[r].push(m);
    });

    const roundNumbers = Object.keys(roundMap).map(Number).sort((a, b) => a - b);

    container.innerHTML = `
      <div class="card" style="overflow-x:auto;">
        <div style="display:flex; gap:2.5rem; min-width:800px; padding:1rem 0;">
          ${roundNumbers.map(rNum => {
            const rMatches = roundMap[rNum];
            const rName = rMatches[0].round_name || `Vòng ${rNum}`;

            return `
              <div style="flex:1; display:flex; flex-direction:column; justify-content:space-around; gap:1.5rem;">
                <h4 style="text-align:center; color:var(--primary); margin-bottom:0.5rem; border-bottom:2px solid var(--border-highlight); padding-bottom:0.5rem;">
                  ${rName}
                </h4>

                ${rMatches.map(m => `
                  <div style="background:rgba(15,23,42,0.8); border:1px solid ${m.status === 'completed' ? 'var(--secondary)' : 'var(--border)'}; border-radius:var(--radius-md); padding:0.75rem; box-shadow:var(--shadow-sm);">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.35rem; font-size:0.85rem; ${m.winner_team_id === m.team1_id ? 'color:var(--secondary); font-weight:700;' : ''}">
                      <span>${m.team1_name}</span>
                      <span data-bracket-t1-score="${m.match_id}" style="font-weight:700; color:var(--accent);">${['completed', 'ongoing', 'waiting_confirmation'].includes(m.status) ? m.team1_score : ''}</span>
                    </div>

                    <div style="height:1px; background:var(--border); margin:0.35rem 0;"></div>

                    <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.85rem; ${m.winner_team_id === m.team2_id ? 'color:var(--secondary); font-weight:700;' : ''}">
                      <span>${m.team2_name}</span>
                      <span data-bracket-t2-score="${m.match_id}" style="font-weight:700; color:var(--accent);">${['completed', 'ongoing', 'waiting_confirmation'].includes(m.status) ? m.team2_score : ''}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }
</script>

              <div class="table-container">

                    <tr>
                      <th>Tên Đội / VĐV</th>

                      <th>Ngày Đăng Ký</th>
                      <th>Trạng Thái</th>
                      <th style="text-align:right;">Thao Tác</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${myTeamsList.map(tm => {
                      const isWithdrawn = tm.status === 'withdrawn';
                      const isRejected = tm.status === 'rejected';
                      const canWithdraw = !isWithdrawn && !isRejected;

                      return `
                        <tr>
                          <td><strong>${tm.name}</strong></td>
                          <td>${tm.tournament_name || 'Giải đấu'}</td>

  function handleWithdrawTeamClick(teamId, teamName) {
    App.modal.open('Rút Lui Khỏi Giải', `Bạn có chắc chắn muốn rút đội "${teamName}" khỏi giải đấu này không? Hành động này sẽ hủy đăng ký và xử thua mặc định các trận chưa thi đấu.`, () => {

          loadMyProfileActivities();

        .catch(err => App.toast.show('Lỗi: ' + err.message, 'error'));

  function submitAdminPasscode() {
    const input = document.getElementById('admin-passcode-input');
    const code = input ? input.value.trim() : '';
    if (!code) {
      App.toast.show('Vui lòng nhập mã bảo mật.', 'warning');
      return;
    }

    App.server.call('apiVerifyAdminPasscode', code)
      .then(res => {
        currentAdminPasscode = code;
        sessionStorage.setItem('admin_passcode', code);
        App.state.user.isSystemAdmin = true;
        App.toast.show('Xác thực quyền Quản trị thành công!', 'success');
        loadAdminDashboardData();

      });

  function switchAdminTab(tabName) {
    currentAdminTab = tabName;

      if (btn.dataset.tab === tabName) {

        btn.classList.remove('btn-secondary');

        btn.classList.remove('btn-primary');

          <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
            <button class="btn btn-primary btn-sm" onclick="switchAdminTab('sports')">🏸 Cấu hình Môn</button>
            <button class="btn btn-secondary btn-sm" onclick="switchAdminTab('tournaments')">🏆 Quản lý Giải đấu</button>
          </div>
        </div>
      </div>
    `;
  }

  // --- TAB 2: SPORTS MANAGEMENT ---
  function renderAdminSportsTab(container) {
    const sports = adminDataCache.sports || [];
    container.innerHTML = `
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;">
          <h3 style="color:var(--primary); margin:0;">Danh Sách Môn Thể Thao Hệ Thống</h3>
          <button class="btn btn-success btn-sm" onclick="openAdminAddSportModal()">➕ Thêm Môn Mới</button>
        </div>

        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Mã Môn</th>
                <th>Tên Môn</th>
                <th>Loại Hình</th>
                <th>Cách Tính Điểm</th>
                <th>Số Người/Đội</th>
                <th>Phân Cấp Trình Độ</th>
                <th>Trạng Thái</th>
                <th style="text-align:right;">Thao Tác</th>
              </tr>
            </thead>
            <tbody>
              ${sports.map(s => `
                <tr>
                  <td><code>${s.sport_id}</code></td>
                  <td><strong>${s.name}</strong></td>
                  <td><span class="badge badge-open">${s.type}</span></td>
                  <td>${s.scoring_type}</td>
                  <td>${s.min_players} - ${s.max_players} người</td>
                  <td>${s.has_skill_level ? '<span style="color:var(--success);">✓ Có (1.0 - 6.0)</span>' : '<span style="color:var(--text-dim);">Không</span>'}</td>
                  <td>
                    <span class="badge ${s.is_active !== false ? 'badge-success' : 'badge-draft'}">
                      ${s.is_active !== false ? 'Đang bật' : 'Tạm tắt'}
                    </span>
                  </td>
                  <td style="text-align:right;">
                    <button class="btn btn-sm ${s.is_active !== false ? 'btn-secondary' : 'btn-success'}" style="padding:2px 8px; font-size:0.8rem;" onclick="adminToggleSportActive('${s.sport_id}', ${s.is_active !== false ? false : true})">
                      ${s.is_active !== false ? 'Tắt' : 'Bật'}
                    </button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  function adminToggleSportActive(sportId, newStatus) {
    App.server.call('apiAdminUpdateSport', sportId, { is_active: newStatus }, currentAdminPasscode)
      .then(() => {
        App.toast.show('Đã cập nhật trạng thái môn thành công!', 'success');
        loadAdminDashboardData();
      })
      .catch(err => App.toast.show('Lỗi: ' + err.message, 'error'));
  }

  function openAdminAddSportModal() {
    const modalHtml = `
      <form id="admin-add-sport-form" onsubmit="handleAdminAddSportSubmit(event)">
        <div class="form-group" style="margin-bottom:0.75rem;">
          <label class="form-label">Tên Môn Thể Thao *</label>
          <input type="text" class="form-control" id="asp-name" required placeholder="Ví dụ: Cầu Mây, Bi-a">
        </div>
        <div class="grid-2" style="gap:0.75rem; margin-bottom:0.75rem;">
          <div class="form-group">
            <label class="form-label">Loại hình</label>
            <select class="form-control" id="asp-type">
              <option value="team">Đồng đội (Team)</option>
              <option value="doubles">Đôi (Doubles)</option>
              <option value="individual">Đơn / Cá nhân (Individual)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Tính điểm</label>
            <select class="form-control" id="asp-scoring">
              <option value="goals">Bàn thắng (Goals)</option>
              <option value="sets">Theo Set (Sets)</option>
              <option value="points">Điểm số (Points)</option>
            </select>
          </div>
        </div>
        <div class="grid-2" style="gap:0.75rem; margin-bottom:0.75rem;">
          <div class="form-group">
            <label class="form-label">Số VĐV tối thiểu / Đội</label>
            <input type="number" class="form-control" id="asp-min-p" value="1" min="1">
          </div>
          <div class="form-group">
            <label class="form-label">Số VĐV tối đa / Đội</label>
            <input type="number" class="form-control" id="asp-max-p" value="2" min="1">
          </div>
        </div>
        <div class="form-group" style="margin-bottom:1rem;">
          <label style="display:inline-flex; align-items:center; gap:0.5rem; cursor:pointer;">
            <input type="checkbox" id="asp-has-levels" checked style="width:16px; height:16px;">
            <span>Áp dụng thang điểm trình độ chuẩn 1.0 - 6.0</span>
          </label>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:0.75rem;">
          <button type="submit" class="btn btn-primary btn-sm">💾 Lưu Môn Mới</button>
        </div>
      </form>
    `;

    App.modal.open('➕ Thêm Môn Thể Thao Mới', modalHtml, null, 'Đóng');
  }

  function handleAdminAddSportSubmit(event) {
    event.preventDefault();
    const hasLevels = document.getElementById('asp-has-levels').checked;
    const sportData = {
      name: document.getElementById('asp-name').value.trim(),
      type: document.getElementById('asp-type').value,
      scoring_type: document.getElementById('asp-scoring').value,
      min_players: document.getElementById('asp-min-p').value,
      max_players: document.getElementById('asp-max-p').value,
      has_skill_level: hasLevels,
      default_levels: hasLevels ? ['1.0', '1.5', '2.0', '2.5', '3.0', '3.5', '4.0', '4.5', '5.0', '5.5', '6.0'] : []
    };

    App.server.call('apiAdminAddSport', sportData, currentAdminPasscode)
      .then(() => {
        App.toast.show('Thêm môn thể thao thành công!', 'success');
        App.modal.close();
        loadAdminDashboardData();
      })
      .catch(err => App.toast.show('Lỗi: ' + err.message, 'error'));
  }

  // --- TAB 3: TOURNAMENTS MANAGEMENT ---
  function renderAdminTournamentsTab(container) {
    const tours = adminDataCache.tournaments || [];
    container.innerHTML = `
      <div class="card">
        <h3 style="color:var(--primary); margin-bottom:1rem;">Quản Lý Toàn Bộ Giải Đấu (${tours.length} giải)</h3>
        
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Tên Giải Đấu</th>
                <th>Người Tạo (Organizer)</th>
                <th>Địa Điểm</th>
                <th>Bắt Đầu</th>
                <th>Trạng Thái</th>
                <th style="text-align:right;">Thao Tác</th>
              </tr>
            </thead>
            <tbody>
              ${tours.map(t => `
                <tr>
                  <td><code>${t.tournament_id}</code></td>
                  <td><strong>${t.name}</strong></td>
                  <td>${t.organizer_email}</td>
                  <td>${t.location}</td>
                  <td>${formatDate(t.start_date)}</td>
                  <td><span class="badge badge-${t.status}">${t.status}</span></td>
                  <td style="text-align:right; white-space:nowrap;">
                    <button class="btn btn-sm btn-secondary" style="padding:2px 6px; font-size:0.75rem;" onclick="App.router.navigateTo('tournament_manage', { tournamentId: '${t.tournament_id}' })">⚙️ Vào Quản Lý</button>
                    <button class="btn btn-sm btn-danger" style="padding:2px 6px; font-size:0.75rem;" onclick="adminDeleteTournament('${t.tournament_id}', '${encodeURIComponent(t.name)}')">🗑️ Xóa</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  function adminDeleteTournament(tournamentId, encodedName) {
    const name = decodeURIComponent(encodedName);
    App.modal.open('Xóa Giải Đấu (Admin Bypass)', `Bạn có chắc chắn muốn xóa vĩnh viễn giải đấu <strong>${name}</strong>? Thao tác này không thể hoàn tác.`, () => {
      App.server.call('apiAdminDeleteTournament', tournamentId, currentAdminPasscode)
        .then(res => {
          App.toast.show(res.message || 'Đã xóa giải đấu!', 'success');
          loadAdminDashboardData();
        })
        .catch(err => App.toast.show('Lỗi: ' + err.message, 'error'));
    });
  }

  // --- TAB 4: USERS MANAGEMENT & RBAC ---
  function renderAdminUsersTab(container) {
    const users = adminDataCache.users || [];
    container.innerHTML = `
      <div class="card">
        <h3 style="color:var(--secondary); margin-bottom:1rem;">Danh Sách Người Dùng & Phân Quyền (${users.length} tài khoản)</h3>

        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>User ID</th>
                <th>Email</th>
                <th>Tên Hiển Thị</th>
                <th>Vai Trò Hệ Thống</th>
                <th>Ngày Tạo</th>
                <th style="text-align:right;">Gán Quyền</th>
              </tr>
            </thead>
            <tbody>
              ${users.map(u => `
                <tr>
                  <td><code>${u.user_id}</code></td>
                  <td><strong>${u.email}</strong></td>
                  <td>${u.display_name || ''}</td>
                  <td>
                    <span class="badge ${u.system_role === 'super_admin' ? 'badge-danger' : (u.system_role === 'organizer' ? 'badge-primary' : 'badge-secondary')}">
                      ${u.system_role || 'user'}
                    </span>
                  </td>
                  <td>${formatDate(u.created_at)}</td>
                  <td style="text-align:right;">
                    <select class="form-control" style="width:auto; display:inline-block; font-size:0.8rem; padding:2px 6px;" onchange="adminChangeUserRole('${u.email}', this.value)">
                      <option value="user" ${(u.system_role || 'user') === 'user' ? 'selected' : ''}>User thường</option>
                      <option value="organizer" ${u.system_role === 'organizer' ? 'selected' : ''}>Organizer</option>
                      <option value="super_admin" ${u.system_role === 'super_admin' ? 'selected' : ''}>🛡️ Super Admin</option>
                    </select>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  function adminChangeUserRole(email, newRole) {
    App.server.call('apiAdminUpdateUserRole', email, newRole, currentAdminPasscode)
      .then(res => {
        App.toast.show(res.message || 'Cập nhật quyền thành công!', 'success');
        loadAdminDashboardData();
      })
      .catch(err => App.toast.show('Lỗi: ' + err.message, 'error'));
  }

  // --- TAB 5: AUDIT LOG ---
  function renderAdminAuditTab(container) {
    const logs = adminDataCache.auditLogs || [];
    container.innerHTML = `
      <div class="card">
        <h3 style="color:var(--accent); margin-bottom:1rem;">📜 Nhật Ký Hoạt Động Hệ Thống (Top 100 Gần Nhất)</h3>

        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Thời Gian</th>
                <th>Người Thực Hiện</th>
                <th>Hành Động (Action)</th>
                <th>Thực Thể</th>
                <th>Mã Đối Tượng</th>
                <th>Chi Tiết</th>
              </tr>
            </thead>
            <tbody>
              ${logs.length === 0 ? `<tr><td colspan="6" style="text-align:center;">Chưa có nhật ký nào.</td></tr>` : ''}
              ${logs.map(log => `
                <tr>
                  <td style="white-space:nowrap; font-size:0.8rem; color:var(--text-muted);">${formatDate(log.timestamp)}</td>
                  <td><strong>${log.user_email}</strong></td>
                  <td><span class="badge badge-open" style="font-size:0.75rem;">${log.action}</span></td>
                  <td>${log.entity_type}</td>
                  <td><code>${log.entity_id || '-'}</code></td>
                  <td style="font-size:0.85rem; max-width:300px; word-break:break-all;">${log.details}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }
</script>


</body>
</html>
