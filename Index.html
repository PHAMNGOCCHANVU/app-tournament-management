<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Giải đấu Thể thao</title>
  <script>
    // Khi mở file cục bộ trực tiếp trên máy tính: tự động chuyển hướng ngay sang preview.html đầy đủ
    if (location.protocol === 'file:' || (typeof google === 'undefined' && !location.hostname.includes('google'))) {
      if (!location.pathname.endsWith('preview.html')) {
        location.replace('preview.html');
      }
    }
  </script>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    .navbar, .mobile-drawer {
      display: none;
    }
  </style>
  <script>
    /**
     * Early initialization for App object.
     * Guarantees App, App.router, and mobile menu helpers are defined immediately
     * before DOM elements render, preventing ReferenceError in local preview or early clicks.
     */
    var App = window.App = window.App || {
      state: { user: null },
      views: (window.App && window.App.views) || {},
      router: {
        navigateTo: function (page, params) {
          var viewFn = (window.App && window.App.views && window.App.views[page]);
          if (typeof viewFn === 'function') {
            try {
              viewFn(params || {});
            } catch (err) {
              console.error('[Router] Error rendering view [' + page + ']:', err);
            }
          } else {
            console.log('[App.router.navigateTo]', page, params);
          }
        }
      },
      toggleMobileMenu: function () {
        var drawer = document.getElementById('mobile-drawer');
        var overlay = document.getElementById('mobile-drawer-overlay');
        if (drawer) drawer.classList.toggle('active');
        if (overlay) overlay.classList.toggle('active');
      },
      closeMobileMenu: function () {
        var drawer = document.getElementById('mobile-drawer');
        var overlay = document.getElementById('mobile-drawer-overlay');
        if (drawer) drawer.classList.remove('active');
        if (overlay) overlay.classList.remove('active');
      },
      notify: function (msg, type) {
        console.log('[Notice - ' + (type || 'info') + ']', msg);
      }
    };

    // Automatic local runner for VS Code Microsoft Edge Tools & local dev preview
    if (typeof google === 'undefined') {
      window.addEventListener('DOMContentLoaded', function () {
        if (!window.App.views || Object.keys(window.App.views).length === 0) {
          if (location.protocol === 'http:' || location.protocol === 'https:') {
            var partials = [
              'Styles', 'Scripts', 'Dashboard', 'TournamentCreate', 'TournamentManage',
              'TeamRegister', 'Schedule', 'MatchResult', 'RankingView', 'BracketView', 'Profile', 'AdminView'
            ];
            Promise.all(partials.map(function (name) {
              return fetch(name + '.html').then(function (res) { return res.text(); });
            })).then(function (contents) {
              contents.forEach(function (html) {
                var div = document.createElement('div');
                div.innerHTML = html;
                Array.from(div.querySelectorAll('style')).forEach(function (st) {
                  document.head.appendChild(st);
                });
                Array.from(div.querySelectorAll('script')).forEach(function (sc) {
                  var script = document.createElement('script');
                  script.textContent = sc.textContent;
                  document.body.appendChild(script);
                });
              });
              if (window.App && window.App.init) window.App.init();
            }).catch(function () {
              showOfflineGuide();
            });
          } else {
            showOfflineGuide();
          }
        }
      });

      function showOfflineGuide() {
        var view = document.getElementById('app-view');
        if (!view) return;
        view.innerHTML = '<div style="max-width:680px; margin:2.5rem auto; padding:2rem; background:rgba(30,41,59,0.85); border:1px solid rgba(255,255,255,0.15); border-radius:16px; text-align:center; color:#f8fafc; box-shadow:0 12px 32px rgba(0,0,0,0.4);">' +
          '<div style="font-size:3rem; margin-bottom:1rem;">🏆</div>' +
          '<h2 style="font-size:1.6rem; margin-bottom:0.75rem;">Chế Độ Xem Trước Cục Bộ (Local Preview)</h2>' +
          '<p style="color:#94a3b8; font-size:0.95rem; line-height:1.6; margin-bottom:1.5rem;">' +
            'Bạn đang mở trực tiếp file nguồn <code>Index.html</code> trong VS Code / Microsoft Edge Tools.<br>' +
            'Vì <code>Index.html</code> là template chứa các lệnh <code>include</code> của Google Apps Script, để xem và tương tác đầy đủ tất cả các trang, vui lòng mở file <code>preview.html</code>:' +
          '</p>' +
          '<div style="display:flex; justify-content:center; gap:1rem; flex-wrap:wrap;">' +
            '<a href="preview.html" style="display:inline-flex; align-items:center; gap:0.5rem; padding:0.75rem 1.5rem; background:#6366f1; color:#fff; border-radius:8px; text-decoration:none; font-weight:600; font-size:0.95rem; box-shadow:0 4px 12px rgba(99,102,241,0.4);">' +
              '🚀 Mở Giao Diện Đầy Đủ (preview.html)' +
            '</a>' +
            '<a href="https://script.google.com/macros/s/AKfycbyjkKVAbtnUOhkvGdLvr7hAhhrYvpQdnVTV_1XrihL_bRzkgiQ4mgKYL0M49QWWM0SH9A/exec" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; gap:0.5rem; padding:0.75rem 1.5rem; background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.2); border-radius:8px; text-decoration:none; font-weight:600; font-size:0.95rem;">' +
              '🌐 Mở Web App Trực Tuyến' +
            '</a>' +
          '</div>' +
        '</div>';
      }
    }
  </script>
  <?!= include('Styles'); ?>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <!-- Mobile Hamburger Menu Button -->
      <button class="mobile-menu-toggle" onclick="App.toggleMobileMenu()" aria-label="Toggle Navigation Menu">☰</button>

      <div class="brand-logo" onclick="App.router.navigateTo('dashboard')">
        <div class="brand-logo-icon">🏆</div>
        <span>SportTournament</span>
      </div>

      <!-- Desktop Header Navigation Links (5 concise English items) -->
      <ul class="nav-links">
        <li class="nav-item active" data-page="dashboard" onclick="App.router.navigateTo('dashboard')">
          Home
        </li>
        <li class="nav-item" data-page="tournament_create" onclick="App.router.navigateTo('tournament_create')">
          Create
        </li>
        <li class="nav-item" data-page="team_register" onclick="App.router.navigateTo('team_register')">
          Register
        </li>
        <li class="nav-item" data-page="schedule" onclick="App.router.navigateTo('schedule')">
          Schedule
        </li>
        <li class="nav-item" data-page="ranking" onclick="App.router.navigateTo('ranking')">
          Standings
        </li>
        <li class="nav-item" data-page="admin_view" id="nav-item-admin" onclick="App.router.navigateTo('admin_view')">
          🛡️ Admin
        </li>
      </ul>

      <!-- Desktop Circular Avatar Account Container -->
      <div class="nav-user" id="nav-user-container">
        <span>Đang xác thực...</span>
      </div>
    </div>
  </nav>

  <!-- Mobile Drawer Sidebar Backdrop Overlay -->
  <div class="mobile-drawer-overlay" id="mobile-drawer-overlay" onclick="App.closeMobileMenu()"></div>

  <!-- Mobile Drawer Sidebar Navigation -->
  <aside class="mobile-drawer" id="mobile-drawer">
    <div class="mobile-drawer-header">
      <div class="brand-logo" onclick="App.router.navigateTo('dashboard'); App.closeMobileMenu();">
        <div class="brand-logo-icon">🏆</div>
        <span>SportTournament</span>
      </div>
    </div>

    <!-- Mobile Navigation Links (5 concise English items) -->
    <ul class="mobile-nav-links">
      <li onclick="App.router.navigateTo('dashboard'); App.closeMobileMenu();">
        🏆 Home
      </li>
      <li onclick="App.router.navigateTo('tournament_create'); App.closeMobileMenu();">
        ➕ Create
      </li>
      <li onclick="App.router.navigateTo('team_register'); App.closeMobileMenu();">
        📝 Register
      </li>
      <li onclick="App.router.navigateTo('schedule'); App.closeMobileMenu();">
        📅 Schedule
      </li>
      <li onclick="App.router.navigateTo('ranking'); App.closeMobileMenu();">
        📊 Standings
      </li>
      <li id="mobile-nav-item-admin" onclick="App.router.navigateTo('admin_view'); App.closeMobileMenu();">
        🛡️ Admin Panel
      </li>
    </ul>

    <!-- Mobile Drawer User Account Card at Bottom -->
    <div class="mobile-drawer-footer" id="mobile-drawer-user-container">
      <div class="loader-center"><div class="spinner"></div></div>
    </div>
  </aside>

  <!-- Main View Container -->
  <main class="app-container">
    <div id="app-view">
      <div class="loader-center">
        <div class="spinner"></div>
        <p>Đang tải ứng dụng...</p>
      </div>
    </div>
  </main>

  <!-- Global Initial Parameters passed from server -->
  <script>
    window.INITIAL_PAGE = "<?= initialPage ?>";
    window.INITIAL_TOURNAMENT_ID = "<?= tournamentId ?>";
  </script>

  <!-- Include Core Scripts Engine -->
  <?!= include('Scripts'); ?>

  <!-- Include Page Partial View Controllers -->
  <?!= include('Dashboard'); ?>
  <?!= include('TournamentCreate'); ?>
  <?!= include('TournamentManage'); ?>
  <?!= include('TeamRegister'); ?>
  <?!= include('Schedule'); ?>
  <?!= include('MatchResult'); ?>
  <?!= include('RankingView'); ?>
  <?!= include('BracketView'); ?>
  <?!= include('Profile'); ?>
  <?!= include('AdminView'); ?>

</body>
</html>
