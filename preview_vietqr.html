<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview: Modal VietQR Thanh Toán Đăng Ký Đội</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap">
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --secondary: #10b981;
      --accent: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --border-highlight: rgba(99, 102, 241, 0.4);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --shadow-md: 0 8px 16px rgba(0, 0, 0, 0.3);
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-image: 
        radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(16, 185, 129, 0.12) 0px, transparent 50%);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid var(--border);
    }

    /* Modal Backdrop & Box */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-box {
      background: #1e293b;
      border: 1px solid var(--border-highlight);
      border-radius: var(--radius-lg);
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalPop {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      padding: 1.5rem;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    .qr-container {
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 1.25rem;
      display: inline-block;
      box-shadow: var(--shadow-md);
      margin: 1rem 0;
      text-align: center;
    }

    .qr-container img {
      max-width: 220px;
      height: auto;
      border-radius: var(--radius-sm);
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
  </style>
</head>
<body>

  <div style="text-align: center; max-width: 600px;">
    <h1 style="margin-bottom: 0.5rem; font-family: var(--font-heading);">Demo: Modal Thanh Toán VietQR Tự Động</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
      Khi người dùng hoàn tất đăng ký đội trên <code>TeamRegister.html</code>, modal này sẽ tự động bật lên với Team ID vừa sinh ra.
    </p>

    <button class="btn btn-primary" onclick="showVietQrModal('FC Rồng Vàng', 'TM' + Math.random().toString(36).substring(2, 14).toUpperCase())">
      ⚡ Bấm vào đây để Xem Thử Modal VietQR
    </button>
  </div>

  <!-- Modal Container -->
  <div id="modal-wrapper" style="display: none;"></div>

  <script>
    function showVietQrModal(teamName, teamId) {
      const vietQrUrl = `https://img.vietqr.io/image/970422-0345678999-compact2.png?amount=0&addInfo=${encodeURIComponent(teamId)}&accountName=BAN%20TO%20CHUC%20GIAI`;

      const modalHtml = `
        <div class="modal-backdrop">
          <div class="modal-box">
            <div class="modal-header">
              <h3 style="margin: 0; font-size: 1.2rem; color: #fff;">Xác Nhận Đăng Ký & Thanh Toán</h3>
              <button onclick="closeModal()" style="background:none; border:none; color:var(--text-muted); font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>

            <div class="modal-body" style="text-align: center;">
              <div style="font-size: 3rem; margin-bottom: 0.25rem;">🎉</div>
              <h3 style="color: var(--secondary); margin-bottom: 0.25rem;">Đăng Ký Thành Công!</h3>
              <p style="font-size: 1rem; color: var(--text-main); margin-bottom: 1rem;">
                Đội <strong>${teamName}</strong> đã được ghi nhận vào hệ thống.
              </p>

              <div style="background: rgba(15,23,42,0.6); padding: 0.85rem 1rem; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 1rem; text-align: left;">
                <p style="font-size: 0.9rem; margin-bottom: 0.25rem;">
                  Mã Đội (Team ID): <strong style="color: var(--primary); font-size: 1.15rem; letter-spacing: 0.5px;">${teamId}</strong>
                </p>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0;">
                  Trạng thái: <span class="badge">Chờ duyệt / Chờ thanh toán</span>
                </p>
              </div>

              <div class="qr-container">
                <p style="font-weight: 700; color: #0f172a; margin-bottom: 0.5rem; font-size: 0.95rem;">
                  Quét Mã QR Chuyển Khoản Lệ Phí (VietQR)
                </p>
                <img src="${vietQrUrl}" alt="VietQR Payment Code">
                <p style="font-size: 0.8rem; color: #475569; margin-top: 0.5rem;">
                  Nội dung CK: <strong style="color: #0f172a; background: #e2e8f0; padding: 2px 6px; border-radius: 4px;">${teamId}</strong>
                </p>
                <p style="font-size: 0.75rem; color: #10b981; font-weight: 600; margin-top: 0.25rem;">
                  ✓ Hệ thống Webhook Sepay/Casso tự động đối soát & duyệt tức thì
                </p>
              </div>

              <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.75rem;">
                Ban tổ chức sẽ gửi email thông báo xác nhận đến bạn sau khi nhận được chuyển khoản.
              </p>
            </div>

            <div class="modal-footer">
              <button class="btn btn-secondary" onclick="closeModal()">Đóng</button>
              <button class="btn btn-primary" onclick="closeModal()">Về Trang Chủ</button>
            </div>
          </div>
        </div>
      `;

      const wrapper = document.getElementById('modal-wrapper');
      wrapper.innerHTML = modalHtml;
      wrapper.style.display = 'block';
    }

    function closeModal() {
      document.getElementById('modal-wrapper').style.display = 'none';
    }

    // Auto open modal on load for instant preview
    window.addEventListener('DOMContentLoaded', () => {
      showVietQrModal('FC Sông Lam', 'TM' + Math.random().toString(36).substring(2, 14).toUpperCase());
    });
  </script>
</body>
</html>
